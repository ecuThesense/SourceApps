palette = "accent"
format = """
[](c1)\
$username\
[](fg:c1 bg:c2)\
$directory\
[](fg:c2 bg:c3)\
$git_branch\
$git_status\
[](fg:c3 bg:c4)\
$docker_context\
[](fg:c4 bg:c5)\
$time\
[](fg:c5 bg:c6)\
$cmd_duration\
[](fg:c6 bg:c6)\
$status\
[ ](fg:c6)\
"""
command_timeout = 5000
scan_timeout = 70
[username]
show_always = true
style_user = "bg:c1"
style_root = "bg:c1"
format = "[ $user ]($style)"
disabled = false
[directory]
style = "bg:c2"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
[c]
symbol = " "
style = "bg:c3"
format = "[ $symbol ($version) ]($style)"
[python]
symbol = " "
style = "bg:c3"
format = "[ $symbol ($version) ]($style)"
[elixir]
symbol = " "
style = "bg:c3"
format = "[ $symbol ($version) ]($style)"
[elm]
symbol = " "
style = "bg:c3"
format = "[ $symbol ($version) ]($style)"
[git_branch]
symbol = ""
style = "bg:c3 fg:#ffffff"
format = "[ $symbol $branch ]($style)"
[git_status]
style = "bg:c3 fg:c6"
format = "[$all_status$ahead_behind ]($style)"
[golang]
symbol = " "
style = "bg:c3"
format = "[ $symbol ($version) ]($style)"
[gradle]
style = "bg:c3"
format = "[ $symbol ($version) ]($style)"
[haskell]
symbol = " "
style = "bg:c3"
format = "[ $symbol ($version) ]($style)"
[java]
symbol = " "
style = "bg:c3"
format = "[ $symbol ($version) ]($style)"
[julia]
symbol = " "
style = "bg:c3"
format = "[ $symbol ($version) ]($style)"
[nodejs]
symbol = ""
style = "bg:c3"
format = "[ $symbol ($version) ]($style)"
[nim]
symbol = " "
style = "bg:c3"
format = "[ $symbol ($version) ]($style)"
[rust]
symbol = ""
style = "bg:c3"
format = "[ $symbol ($version) ]($style)"
[scala]
symbol = " "
style = "bg:c3"
format = "[ $symbol ($version) ]($style)"
[docker_context]
symbol = " "
style = "bg:c4"
format = "[ $symbol $context ]($style) $path"
[time]
disabled = false
time_format = "%T" # Hour:Minute:Seconds AM/PM Format
style = "bg:c5 fg:#000000"
format = "[  $time ]($style)"
[cmd_duration]
style = "bg:c6 fg:#000000"
min_time = 500
format = "[ took: $duration ]($style)"
[status]
style = "bg:c6"
symbol = " "
success_symbol = " "
format = "[ $symbol$common_meaning$signal_name$maybe_int ]($style)"
map_symbol = true
disabled = false

[palettes.accent]
c1 = "#503600"
c2 = "#785100"
c3 = "#a06c00"
c4 = "#c88800"
c5 = "#deb766"
c6 = "#e6c98c"
