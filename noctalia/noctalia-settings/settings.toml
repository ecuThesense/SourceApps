[nightlight]
temperature_day = 8500
temperature_night = 8500

[plugins]
auto_update = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    enabled = false
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
corner_radius_scale = 2.0
font_family = "DejaVu Sans Mono"
niri_overview_type_to_launch_enabled = true

    [shell.panel]
    clipboard_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_session = true

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
custom_palette = "wallhaven-mc"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "niri" ]
    enable_community_templates = false

[wallpaper]
fill_color = "primary"

    [wallpaper.default]
    path = "/home/pavel/Pictures/wallhaven.png"

    [wallpaper.last]
    path = "/home/pavel/Pictures/wallhaven.png"

    [wallpaper.monitor.DP-3]
    fill_color = "primary"

    [wallpaper.monitor.DP-4]
    fill_color = "primary"

    [wallpaper.monitor.DP-5]
    fill_color = "primary"

    [wallpaper.monitor.eDP-1]
    fill_color = "primary"

    [wallpaper.monitors.DP-3]
    path = "/home/pavel/Pictures/wallhaven.png"

    [wallpaper.monitors.DP-4]
    path = "/home/pavel/Pictures/wallhaven.png"

    [wallpaper.monitors.DP-5]
    path = "/home/pavel/Pictures/wallhaven.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/pavel/Pictures/wallhaven.png"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/pavel/Pictures/wallhaven.png"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

[weather]
enabled = false

[widget.active_window]
display = "icon_only"
min_length = 0

[widget.control-center]
enabled = false

[widget.keyboard_layout]
show_glyph = false

[widget.media]
art_size = 26
color = "primary"
hide_when_no_media = true
icon_color = "primary"
min_length = 0
show_progress = true

[widget.session]
enabled = false

[widget.sysmon]
stat = "ram_used"
visualization = "none"