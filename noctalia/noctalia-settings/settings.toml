config_version = 15

[backdrop]
blur_intensity = 0.11999999731779099

[bar.default]
background_opacity = 0.84999998100101948
border = "primary"
center = [ "clock", "media" ]
color = "primary"
end = [
    "keyboard_layout",
    "tray",
    "clipboard",
    "sysmon",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session",
    "notifications"
]
font_scale = 1.1499999817460775
font_weight = 700
icon_color = "primary"
scale = 1.2000000104308128
start = [ "launcher", "wallpaper", "workspaces", "taskbar" ]
widget_spacing = 10

[control_center.calendar]
show_events_card = false

[[control_center.shortcuts]]
type = "clipboard"

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "power_profile"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

